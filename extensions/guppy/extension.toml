id = "guppy"
name = "Guppy (DiracQ)"
description = "First-class Guppy editing for DiracQ: syntax, highlighting, indentation, brackets, and the DiracQ Guppy LSP."
version = "0.1.0"
schema_version = 1
authors = ["Dirac Technologies — DiracQ team"]
repository = "https://github.com/rismanmattotorang/diracq"

[language_servers.diracq-guppy-lsp]
name = "DiracQ Guppy LSP"
languages = ["Guppy"]

[grammars.guppy]
# Guppy IS syntactically Python (decorators + a linear type discipline), so we
# reuse the upstream tree-sitter-python grammar verbatim and layer Guppy-aware
# highlight/indent queries on top (see languages/guppy/*.scm). This is the
# correct, low-maintenance choice per G4/ADR-00: adopt upstream, never fork a
# parser — and it sidesteps reimplementing Python's indentation scanner.
# Pinned to tree-sitter-python v0.23.6 (re-verify on upgrade).
repository = "https://github.com/tree-sitter/tree-sitter-python"
commit = "bffb65a8cfe4e46290331dfef0dbf0ef3679de11"
