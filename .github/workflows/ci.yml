name: CI

# DiracQ CI rebuilds against the pinned stack and runs the standalone checks
# that do not require a vendored Zed (the additive crates, the WASM extension
# target, and the sidecar dispatcher). The full GPU build (--features gpui) runs
# in a separate workflow once third_party/zed is vendored.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    name: Rust workspace (standalone, no GPUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: check
        run: cargo check --workspace

  extension:
    name: Guppy WASM extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: check (wasm32-wasip2)
        working-directory: extensions/guppy
        # Network-dependent (pulls zed_extension_api); allowed to be informational
        # until the grammar repo and ABI pin are finalised.
        run: cargo check --target wasm32-wasip2 || echo "::warning::extension check needs pinned zed_extension_api"

  sidecar:
    name: Python sidecar dispatcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install + test
        working-directory: sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest
          PYTHONPATH=. pytest -q
